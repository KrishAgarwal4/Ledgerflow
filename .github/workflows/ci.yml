name: Chronos CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Concurrency & Ledger Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos_secure_password
          POSTGRES_DB: chronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://chronos:chronos_secure_password@localhost:5432/chronos
        run: |
          PYTHONPATH=. alembic -c backend/alembic.ini heads

      - name: Run Pytest Suite (Concurrency, Invariants, Dunning, Idempotency)
        env:
          DATABASE_URL: postgresql+asyncpg://chronos:chronos_secure_password@localhost:5432/chronos
        run: |
          PYTHONPATH=. pytest backend/tests/ -v

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix frontend ci

      - name: Compile TypeScript & Build Production Bundle
        run: |
          npm --prefix frontend run build
